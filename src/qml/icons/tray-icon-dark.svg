<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- High-contrast light/cyan outer bezel for dark KDE taskbars -->
  <rect x="6" y="6" width="116" height="116" rx="22" fill="#0f172a" stroke="#f1f5f9" stroke-width="6"/>
  <rect x="12" y="12" width="104" height="104" rx="17" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75"/>
  <!-- 3x4 luminous RGB key grid -->
  <rect x="20" y="22" width="18" height="18" rx="4" fill="#38bdf8"/>
  <rect x="42" y="22" width="18" height="18" rx="4" fill="#38bdf8"/>
  <rect x="64" y="22" width="18" height="18" rx="4" fill="#38bdf8"/>
  <rect x="20" y="44" width="18" height="18" rx="4" fill="#4ade80"/>
  <rect x="42" y="44" width="18" height="18" rx="4" fill="#4ade80"/>
  <rect x="64" y="44" width="18" height="18" rx="4" fill="#4ade80"/>
  <rect x="20" y="66" width="18" height="18" rx="4" fill="#fbbf24"/>
  <rect x="42" y="66" width="18" height="18" rx="4" fill="#fbbf24"/>
  <rect x="64" y="66" width="18" height="18" rx="4" fill="#fbbf24"/>
  <rect x="20" y="88" width="18" height="18" rx="4" fill="#f87171"/>
  <rect x="42" y="88" width="18" height="18" rx="4" fill="#c084fc"/>
  <rect x="64" y="88" width="18" height="18" rx="4" fill="#c084fc"/>
  <!-- Rotary encoders & OLED on right -->
  <circle cx="98" cy="31" r="10" fill="#1e293b" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="98" cy="55" r="10" fill="#1e293b" stroke="#f8fafc" stroke-width="3"/>
  <rect x="86" y="72" width="24" height="34" rx="4" fill="#020617" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="90" y="80" width="16" height="3" rx="1.5" fill="#38bdf8"/>
  <rect x="90" y="87" width="12" height="3" rx="1.5" fill="#e2e8f0"/>
</svg>
