[package]
name = "duckydeck-studio"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "KDE Plasma 6 / Kirigami Configurator & AI Macro Architect for duckyPad Pro"
homepage = "https://duckydeckstudio.com"
documentation = "https://duckydeckstudio.com"
repository = "https://github.com/russellmilliner/duckydeck-studio"

[lib]
name = "duckydeck_core"
path = "src/lib.rs"
test = false

[[bin]]
name = "duckydeck-studio"
path = "src/main.rs"

[features]
default = []
demo = []

[dependencies]
# Qt 6 / QML Bridge (KDAB CXX-Qt)
cxx = "1.0.130"
cxx-qt = "0.7.2"
cxx-qt-lib = { version = "0.7.2", features = ["qt_gui", "qt_qml"] }

# USB HID Communication (uses Linux hidraw directly)
hidapi = { version = "2.6.3", default-features = false, features = ["linux-static-hidraw"] }

# Async Runtime, Wayland KWin DBus & AI HTTP Client
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time"] }
zbus = { version = "5.1", default-features = false, features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization & Config Parsing (for SD card profiles & KDE shortcut scraping)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[build-dependencies]
# Compiles the #[cxx_qt::bridge] macros and embeds QML files into the binary
cxx-qt-build = { version = "0.7.2", features = ["link_qt_object_files"] }
